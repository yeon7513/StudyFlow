<!doctype html>
<html
  lang="ko"
  layout:decorate="~{/layout/admin/dashboard}"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  xmlns:th="http://www.thymeleaf.org"
>
  <div th:fragment="modifyForm(detail)">
    <form class="p-4 bg-light border-bottom" method="post" th:action="@{/admin/operator/update}">
      <div style="max-width: 800px; margin: 0 auto;">

        <div class="mb-4 row align-items-center">
          <label class="col-sm-3 col-md-2 col-form-label fw-bold" th:for="|id_${detail.id}|">아이디</label>
          <div class="col-sm-9 col-md-6">
            <input class="form-control-plaintext text-secondary" readonly th:field="${detail.id}"
                   th:id="|id_${detail.id}|" type="text">
          </div>
        </div>

        <div class="mb-4 row align-items-center">
          <label class="col-sm-3 col-md-2 col-form-label fw-bold" th:for="|name_${detail.id}|">이름</label>
          <div class="col-sm-9 col-md-6">
            <input class="form-control" th:field="${detail.name}" th:id="|name_${detail.id}|" type="text">
          </div>
        </div>

        <div class="mb-4 row align-items-center">
          <label class="col-sm-3 col-md-2 col-form-label fw-bold">권한</label>
          <div class="col-sm-9 col-md-10 d-flex align-items-center pt-2">
            <div class="form-check form-check-inline me-4">
              <input class="form-check-input" name="role" th:checked="${detail.role == 'SUPER'}"
                     th:id="|roleSuper_${detail.id}|" type="radio" value="SUPER">
              <label class="form-check-label" th:for="|roleSuper_${detail.id}|">최고관리자</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" name="role" th:checked="${detail.role == 'BASIC'}"
                     th:id="|roleBasic_${detail.id}|" type="radio" value="BASIC">
              <label class="form-check-label" th:for="|roleBasic_${detail.id}|">일반관리자</label>
            </div>
          </div>
        </div>

        <div class="mb-4 row align-items-center">
          <label class="col-sm-3 col-md-2 col-form-label fw-bold">상태</label>
          <div class="col-sm-9 col-md-10 pt-1">
            <div class="form-check form-switch p-0 m-0">
              <input class="form-check-input m-0" name="isActive" role="switch"
                     style="cursor: pointer; width: 40px; height: 20px;" th:checked="${detail.isActive}"
                     th:id="|activeSwitch_${detail.id}|"
                     type="checkbox"
                     value="true">
              <input name="_isActive" type="hidden" value="on" />
            </div>
          </div>
        </div>

      </div>

      <div class="text-center pt-3 mt-3" style="border-top: 1px solid #dee2e6;">
        <button class="btn btn-outline-secondary px-4 me-2" data-bs-toggle="collapse"
                th:data-bs-target="|#collapse_${detail.id}|" type="button">닫기
        </button>
        <button class="btn btn-primary px-4" type="submit">저장</button>
      </div>
    </form>
  </div>
</html>
