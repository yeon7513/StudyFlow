<!doctype html>
<html
  lang="ko"
  layout:decorate="~{/layout/admin/dashboard}"
  th:with="breadCrumbs=${ { {label: '관심 분야 관리', path: null} } }"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  xmlns:th="http://www.thymeleaf.org"
>
  <head>
    <link href="/css/admin/interest/interest.css" rel="stylesheet" />
    <script defer src="/js/admin/interest/category/interest_category.js" type="module"></script>
    <script defer src="/js/admin/interest/keyword/interest_keyword.js" type="module"></script>
    <script defer src="/js/admin/interest/interest_main.js" type="module"></script>
  </head>
  <body>
    <section id="interest" layout:fragment="container">
      <h2>관심 분야 관리</h2>
      <div th:replace="~{layout/admin/fragments/interest/widget :: Widget}"></div>

      <div class="my-4">
        <ul class="nav nav-pills">
          <li class="nav-item">
            <button class="nav-link active tab-button"
                    data-url="category"
                    type="button">카테고리
            </button>
          </li>
          <li class="nav-item">
            <button class="nav-link tab-button"
                    data-url="keyword"
                    type="button">키워드
            </button>
          </li>
        </ul>
      </div>

      <article id="tab-panel">
        <th:block th:replace="~{layout/admin/fragments/interest/category_panel :: CategoryPanel}"></th:block>
      </article>
    </section>
  </body>
</html>
