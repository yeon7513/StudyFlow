<!doctype html>
<html
  lang="ko"
  layout:decorate="~{/layout/admin/dashboard}"

  xmlns:th="http://www.thymeleaf.org"
>
  <head>
    <link href="/css/admin/interest/interest.css" rel="stylesheet" />

  <body>
    <section id="interest" layout:fragment="container">

        <button class="tab-button" data-url="keyword" type="button">키워드</button>

      <article id="tab-panel">
