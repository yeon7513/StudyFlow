<!doctype html>
<html
  lang="ko"
  layout:decorate="~{/layout/admin/dashboard}"
  th:with="breadCrumbs=${ { {label: '문의 관리', path: null} } }"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  xmlns:th="http://www.thymeleaf.org"
>
  <head>
    <link href="/css/admin/qna/list.css" rel="stylesheet" />
    <script defer src="/js/admin/qna/list.js"></script>
  </head>
  <body>
    <section layout:fragment="container">
      <h2>문의 관리</h2>

      <div
        th:replace="~{layout/admin/fragments/search_form :: SearchForm(~{:: #filters})}"
      >
        <div id="filters">
          <!-- 필터 선택 -->
          <div class="filters">
            <div class="select-group">
              <div class="filter select-group">
                <!-- 취소 여부 -->
                <h4>답변 상태</h4>
                <select name="answerState">
                  <option th:each="option : ${searchOptions.answerStates}"
                          th:selected="${option.isSelected}"
                          th:text="${option.label}"
                          th:value="${option.value}"
                  ></option>
                </select>
              </div>
            </div>
          </div>

          <div class="filters">
            <!-- 날짜별 -->
            <div class="filter date-group">
              <h4>작성일자</h4>
              <label>시작일</label>
              <input name="startDate" type="date" />
              <label>종료일</label>
              <input name="endDate" type="date" />
            </div>

            <!-- 검색어 -->
            <div class="filter text-group">
              <h4>상세 검색</h4>
              <select name="search">
                <option th:each="option : ${searchOptions.keywordSearch}"
                        th:selected="${option.isSelected}"
                        th:text="${option.label}"
                        th:value="${option.value}"
                ></option>
              </select>
              <input
                autocomplete="off"
                name="keyword"
                placeholder="검색어를 입력하세요."
                type="text"
              />
            </div>
          </div>
        </div>
      </div>

      <div class="flex-box contents">
        <div class="posts">
          <table border="1">
            <thead>
              <tr>
                <th>No.</th>
                <th>제목</th>
                <th>답변여부</th>
                <th>작성일</th>
              </tr>
            </thead>
            <tbody>
              <tr th:if="${questionPosts.isEmpty()}">
                <td colspan="4">
                  <p>작성된 문의글이 없습니다.</p>
                </td>
              </tr>

              <tr
                th:each="qna : ${questionPosts}"
                th:if="${qna.isActive == true}"
              >
                <td class="num" th:text="${qna.no}">글번호</td>
                <td class="title">
                  <button
                    class="load-detail-btn"
                    th:data-post-no="${qna.no}"
                    th:text="${qna.title}"
                    type="button"
                  >
                    게시글 제목
                  </button>
                </td>
                <td>
                  <span
                    th:class="${qna.answered == false} ? 'status waiting' : 'status complete'"
                    th:text="${qna.answered == false} ? '미답변' : '답변완료'"
                  >답변 여부</span
                  >
                </td>
                <td class="date" th:text="${qna.createdAt}">작성일</td>
              </tr>
            </tbody>

            <tfoot>
              <tr>
                <td colspan="4">
                  <div
                    th:replace="~{/layout/common/fragments/pagination :: Pagination(${pager})}"
                  ></div>
                </td>
              </tr>
            </tfoot>
          </table>
        </div>

        <article id="qna-detail">
          <div th:if="${detailPost == null}">
            <p>현재 대기 중인 문의글이 없습니다.</p>
          </div>

          <div
            th:if="${detailPost != null}"
            th:insert="~{/layout/admin/fragments/qna_detail :: QnaDetail}"
          ></div>
        </article>
      </div>
    </section>
  </body>
</html>
