<!doctype html>
<html
  lang="ko"
  layout:decorate="~{/layout/admin/dashboard}"
  th:with="breadCrumbs=${ { {label: '예약자 관리', path: null} } }"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  xmlns:th="http://www.thymeleaf.org"
>
  <head>
    <title>스터디 플로우</title>
    <link href="/css/admin/reservation/reservation.css" rel="stylesheet" />
    <script defer src="/js/admin/reservation/list.js"></script>
    <script defer src="/js/admin/search.js"></script>
  </head>
  <body>
    <section layout:fragment="container">
      <div class="contents">
        <!-- 검색 필터 -->
        <div
          th:replace="~{layout/admin/fragments/global/search_form :: SearchForm(~{:: #filters})}"
        >

          <div id="filters">
            <div class="mb-4 filter">
              <h6 class="fw-bold mb-2 option-title text-nowrap">예약 상태</h6>
              <div class="d-flex gap-3">
                <div class="form-check" th:each="option : ${searchOptions.reserveStates}">
                  <input class="form-check-input" name="reserveState"
                         th:checked="${pager.reserveState != null and #lists.contains(pager.reserveState, option.value)}"
                         th:id="${option.value}" th:value="${option.value}"
                         type="radio">
                  <label class="form-check-label" th:for="${option.value}" th:text="${option.label}"></label>
                </div>
              </div>
            </div>

            <div class="mb-4 filter">
              <h6 class="fw-bold mb-2 option-title text-nowrap">지역</h6>
              <div class="d-flex flex-wrap gap-3">
                <div class="form-check" th:each="option : ${searchOptions.regions}">
                  <input class="form-check-input" name="region"
                         th:checked="${pager.region != null and #lists.contains(pager.region, option.value)}"
                         th:id="${'reg_'+option.value}" th:value="${option.value}"
                         type="checkbox">
                  <label class="form-check-label" th:for="${'reg_'+option.value}" th:text="${option.label}"></label>
                </div>
              </div>
            </div>

            <div class="mb-4 filter">
              <h6 class="fw-bold mb-2 option-title text-nowrap">유입경로</h6>
              <div class="d-flex flex-wrap gap-3">
                <div class="form-check" th:each="option : ${searchOptions.inflows}">
                  <input class="form-check-input" name="inflow"
                         th:checked="${pager.inflow != null and #lists.contains(pager.inflow, option.value)}"
                         th:id="${'inf_'+option.value}" th:value="${option.value}"
                         type="checkbox">
                  <label class="form-check-label" th:for="${'inf_'+option.value}" th:text="${option.label}"></label>
                </div>
              </div>
            </div>

            <div class="row g-3 align-items-end">
              <div class="col-md-4 filter">
                <h6 class="fw-bold mb-2 option-title text-nowrap">예약일자</h6>
                <div class="input-group">
                  <input class="form-control" name="startDate" th:value="${pager.startDate}" type="date">
                  <span class="input-group-text">~</span>
                  <input class="form-control" name="endDate" th:value="${pager.endDate}" type="date">
                </div>
              </div>
              <div class="col-md-5 filter">
                <h6 class="fw-bold mb-2 option-title text-nowrap">상세 검색</h6>
                <div class="input-group">
                  <select class="form-select" name="search" style="max-width: 120px;">
                    <option th:each="option : ${searchOptions.reservationSearch}"
                            th:selected="${pager.search == option.value}" th:text="${option.label}"
                            th:value="${option.value}"></option>
                  </select>
                  <input class="form-control" name="keyword" placeholder="검색어를 입력하세요."
                         th:value="${pager.keyword}" type="text">
                </div>
              </div>
            </div>
          </div>

        </div>

        <div th:if="${reservations.isEmpty()}">
          <p>검색된 예약자 내역이 없습니다.</p>
        </div>

        <ul class="reservations">
          <li
            th:data-no="${reservation.no}"
            th:each="reservation : ${reservations}"
          >
            <span th:text="${reservation.no}">예약 고유 번호</span>
            <div>
              <p th:text="${reservation.email}">이메일</p>
              <p th:text="${reservation.name}">예약자명</p>
            </div>
            <div>
              <p th:text="${reservation.region}">지역</p>
              <p th:text="${reservation.inflow}">유입경로</p>
              <p th:text="${reservation.createdAt}">예약일</p>
            </div>
            <div>
              <span th:text="${reservation.isCanceled ? 'Y' : 'N'}"
              >취소여부</span
              >
            </div>
          </li>
        </ul>

        <div
          th:replace="~{/layout/common/fragments/pagination :: Pagination(${pager})}"
        ></div>
      </div>

      <div
        th:replace="~{/layout/admin/fragments/reservation/reserve_detail :: Modal}"
      ></div>
    </section>
  </body>
</html>
