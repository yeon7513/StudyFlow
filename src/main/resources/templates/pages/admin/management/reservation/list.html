<!doctype html>
<html
  lang="ko"
  layout:decorate="~{/layout/admin/dashboard}"
  th:with="breadCrumbs=${ { {label: '예약자 관리', path: null} } }"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  xmlns:th="http://www.thymeleaf.org"
>
  <head>
    <title>스터디 플로우</title>
    <link href="/css/admin/reservation/reservation.css" rel="stylesheet" />
    <script defer src="/js/admin/reservation/list.js"></script>
    <script defer src="/js/admin/search.js"></script>
  </head>
  <body>
    <section layout:fragment="container">
      <div class="contents">
        <!-- 검색 필터 -->
        <div
          th:replace="~{layout/admin/fragments/global/search_form :: SearchForm(~{:: #filters})}"
        >
          <div id="filters">
            <!-- 탭 메뉴 -->
            <div class="tab-menu">
              <h4>예약 상태</h4>
              <label th:each="option : ${searchOptions.reserveStates}" th:for="${option.value}">
                <input name="reserveState"
                       th:checked="${pager.reserveState != null and #lists.contains(pager.reserveState, option.value)}"
                       th:id="${option.value}"
                       th:value="${option.value}" type="radio" />
                <span th:text="${option.label}"></span>
              </label>
            </div>

            <div class="filter region-group">
              <h4 class="option-title">지역</h4>
              <label th:each="option : ${searchOptions.regions}" th:for="${option.value}">
                <input name="region"
                       th:checked="${pager.region != null and #lists.contains(pager.region, option.value)}"
                       th:id="${option.value}"
                       th:value="${option.value}"
                       type="checkbox" />
                <span th:text="${option.label}"></span>
              </label>
            </div>

            <div class="filter inflow-group">
              <h4 class="option-title">유입경로</h4>
              <label th:each="option : ${searchOptions.inflows}" th:for="${option.value}">
                <input name="inflow"
                       th:checked="${pager.inflow != null and #lists.contains(pager.inflow, option.value)}"
                       th:id="${option.value}"
                       th:value="${option.value}"
                       type="checkbox"
                />
                <span th:text="${option.label}"></span>
              </label>
            </div>

            <!-- 예약 날짜별 -->
            <div class="filter date-group">
              <h4 class="option-title">예약일자</h4>
              <label>
                <span>
                  시작일
                </span>
                <input name="startDate" th:value="${pager.startDate}" type="date" />
              </label>
              <label>
                <span>종료일</span>
                <input name="endDate" th:value="${pager.endDate}" type="date" />
              </label>
            </div>

            <!-- 검색어 -->
            <div class="filter text-group">
              <h4>상세 검색</h4>
              <select name="search">
                <option th:each="option : ${searchOptions.reservationSearch}"
                        th:selected="${pager.search == option.value}"
                        th:text="${option.label}"
                        th:value="${option.value}"></option>
              </select>
              <input
                autocomplete="off"
                name="keyword"
                placeholder="검색어를 입력하세요."
                th:value="${pager.keyword}"
                type="text"
              />
            </div>
          </div>
        </div>

        <div th:if="${reservations.isEmpty()}">
          <p>검색된 예약자 내역이 없습니다.</p>
        </div>

        <ul class="reservations">
          <li
            th:data-no="${reservation.no}"
            th:each="reservation : ${reservations}"
          >
            <span th:text="${reservation.no}">예약 고유 번호</span>
            <div>
              <p th:text="${reservation.email}">이메일</p>
              <p th:text="${reservation.name}">예약자명</p>
            </div>
            <div>
              <p th:text="${reservation.region}">지역</p>
              <p th:text="${reservation.inflow}">유입경로</p>
              <p th:text="${reservation.createdAt}">예약일</p>
            </div>
            <div>
              <span th:text="${reservation.isCanceled ? 'Y' : 'N'}"
              >취소여부</span
              >
            </div>
          </li>
        </ul>

        <div
          th:replace="~{/layout/common/fragments/pagination :: Pagination(${pager})}"
        ></div>
      </div>

      <div
        th:replace="~{/layout/admin/fragments/reserve_detail :: Modal}"
      ></div>
    </section>
  </body>
</html>
