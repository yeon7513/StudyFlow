<!doctype html>
<html
  lang="ko"
  layout:decorate="~{/layout/admin/dashboard}"
  th:with="breadCrumbs=${ { {label: '예약자 관리', path: null} } }"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  xmlns:th="http://www.thymeleaf.org"
>
  <head>
    <title>스터디 플로우</title>
    <link href="/css/admin/reservation/reservation.css" rel="stylesheet" />
    <script defer src="/js/admin/reservation/list.js"></script>
  </head>
  <body>
    <section layout:fragment="container">
      <div class="contents">
        <div th:if="${reservations.isEmpty()}">
          <p>검색된 예약자 내역이 없습니다.</p>
        </div>

        <div
          th:replace="~{layout/admin/fragments/search_form :: SearchForm(~{:: #filters})}"
        >
          <div id="filters">
            <div class="filters">
              <div class="select-group">
                <div class="filter select-group">
                  <!-- 취소 여부 -->
                  <h4>예약 상태</h4>
                  <select id="is-canceled" name="reserveState">
                    <option th:each="option : ${searchOptions.reserveStates}"
                            th:selected="${option.isSelected}"
                            th:text="${option.label}"
                            th:value="${option.value}"></option>
                  </select>

                  <!-- 지역 및 유입경로 선택 -->
                  <h4>지역</h4>
                  <select id="region" name="region">
                    <option th:each="option : ${searchOptions.regions}"
                            th:selected="${option.isSelected}"
                            th:text="${option.label}"
                            th:value="${option.value}"></option>
                  </select>

                  <h4>유입경로</h4>
                  <select name="inflow">
                    <option th:each="option : ${searchOptions.inflows}"
                            th:selected="${option.isSelected}"
                            th:text="${option.label}"
                            th:value="${option.value}"></option>
                  </select>
                </div>
              </div>
            </div>

            <div class="filters">
              <!-- 예약 날짜별 -->
              <div class="filter date-group">
                <h4>예약일자</h4>
                <label>시작일</label>
                <input name="startDate" type="date" />
                <label>종료일</label>
                <input name="endDate" type="date" />
              </div>

              <!-- 검색어 -->
              <div class="filter text-group">
                <h4>상세 검색</h4>
                <select name="search">
                  <option th:each="option : ${searchOptions.keywordSearch}"
                          th:selected="${option.isSelected}"
                          th:text="${option.label}"
                          th:value="${option.value}"></option>
                </select>
                <input
                  autocomplete="off"
                  name="keyword"
                  placeholder="검색어를 입력하세요."
                  type="text"
                />
              </div>
            </div>
          </div>
        </div>

        <ul class="reservations">
          <li
            th:data-no="${reservation.no}"
            th:each="reservation : ${reservations}"
          >
            <span th:text="${reservation.no}">예약 고유 번호</span>
            <div>
              <p th:text="${reservation.email}">이메일</p>
              <p th:text="${reservation.name}">예약자명</p>
            </div>
            <div>
              <p th:text="${reservation.region}">지역</p>
              <p th:text="${reservation.inflow}">유입경로</p>
              <p th:text="${reservation.createdAt}">예약일</p>
            </div>
            <div>
              <span th:text="${reservation.isCanceled ? 'Y' : 'N'}"
              >취소여부</span
              >
            </div>
          </li>
        </ul>

        <div
          th:replace="~{/layout/common/fragments/pagination :: Pagination(${pager})}"
        ></div>
      </div>

      <div
        th:replace="~{/layout/admin/fragments/reserve_detail :: Modal}"
      ></div>
    </section>
  </body>
</html>
