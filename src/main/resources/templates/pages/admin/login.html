<!doctype html>
<html
  lang="ko"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
>
  <head>
    <title layout:fragment="title">스터디 플로우 - 관리자 로그인</title>
    <link href="/css/common/common.css" rel="stylesheet" />
    <!-- 부트스트랩 라이브러리 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script defer src="/js/admin/login.js"></script>
  </head>
  <body>
    <section class="container d-flex justify-content-center align-items-center min-vh-100">

      <div class="col-12 col-md-6 col-lg-4">
        <div class="card p-4 border-0 shadow rounded-4">

          <div class="text-center mb-3">
            <h1 class="mb-2">
              <a class="text-decoration-none fw-bold text-primary" href="/">STUDY FLOW</a>
            </h1>
            <p class="fs-4 fw-semibold text-dark">관리자 로그인</p>
            <hr class="w-25 mx-auto border-2 border-primary mt-4">
          </div>

          <form id="login-form" method="post" th:action="@{/admin/login}">
            <div class="mb-3">
              <label class="form-label" for="id">아이디</label>
              <input class="form-control" id="id" name="id" required type="text" />
            </div>
            <div class="mb-4">
              <label class="form-label" for="pw">비밀번호</label>
              <input class="form-control" id="pw" name="pw" required type="password" />
            </div>

            <div class="d-grid gap-2">
              <button class="btn btn-primary fw-bold" type="submit">로그인</button>
              <a class="btn btn-light border fw-bold text-secondary" href="/">
                메인 페이지로 돌아가기
              </a>
            </div>
          </form>

        </div>
      </div>

    </section>
  </body>
</html>
