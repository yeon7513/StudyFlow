<!doctype html>
<html
  lang="ko"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{/layout/layout}"
>
  <head>
    <title layout:fragment="title">스터디 플로우 - 관리자 로그인</title>
    <script defer src="/js/admin/login.js"></script>
  </head>
  <body>
    <section layout:fragment="container">
      <h2>admin - login.html</h2>
      <p>관리자 로그인 페이지</p>

      <div class="form-wrap">
        <form id="login-form" method="post">
          <div class="input-group">
            <input
              id="id"
              class="text-field"
              type="text"
              name="id"
              placeholder="아이디 입력"
              autocomplete="no-id"
              required
            />
            <label for="id" class="text-label">아이디</label>
          </div>
          <div class="input-group">
            <input
              id="pw"
              class="text-field"
              type="password"
              name="pw"
              placeholder="비밀번호 입력"
              autocomplete="off"
              required
            />
            <label for="pw" class="text-label">비밀번호</label>
          </div>
          <div>
            <button type="submit" class="btn">관리자 로그인</button>
          </div>
        </form>
      </div>
    </section>
  </body>
</html>
