<!doctype html>
<html
  lang="ko"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{/layout/layout}"
>
  <head>
    <title layout:fragment="title">스터디 플로우 - 사전예약</title>
    <th:block layout:fragment="css">
      <link rel="stylesheet" href="/css/preorder/reserve.css" />
    </th:block>
    <th:block layout:fragment="js">
      <script defer src="/js/preorder/reserve.js"></script>
    </th:block>
  </head>
  <body>
    <section layout:fragment="container">
      <th:block
        th:replace="~{layout/fragments/Banner :: Banner(
          '사전 예약', 
          '내 커리어를 레벨업 할 맞춤형 리포트', 
          '지금 어떤 분야의 성장을 원하시나요?<br>관심 분야를 설정하시면, 나의 다음 스텝에 딱 맞는 학습 로드맵과 사전예약 특별 혜택을 안내해 드립니다.'
        )}"
      >
      </th:block>
      <!-- 예약자 정보 입력 -->
      <form id="user-info">
        <div class="input-group">
          <input
            id="email"
            class="text-field"
            type="email"
            name="email"
            placeholder="이메일 입력"
            autocomplete="no-email"
          />
          <label for="email" class="text-label">이메일</label>
        </div>
        <div class="input-group">
          <input
            id="password"
            class="text-field"
            type="password"
            name="password"
            placeholder="비밀번호 입력"
            autocomplete="off"
          />
          <label for="password" class="text-label">비밀번호</label>
        </div>
        <div class="input-group">
          <input
            id="name"
            class="text-field"
            type="text"
            name="name"
            placeholder="예약자명 입력"
            autocomplete="no-name"
          />
          <label for="name" class="text-label">예약자명</label>
        </div>
        <div class="input-group">
          <input
            id="phone"
            class="text-field"
            type="text"
            name="phone"
            placeholder="연락처 입력"
            autocomplete="off"
          />
          <label for="phone" class="text-label">연락처</label>
        </div>
        <div>
          <button id="save-user-info" type="button" class="btn">
            관심 분야 선택
          </button>
          <a href="/preorder" class="btn cancel">취소</a>
        </div>
      </form>
    </section>
  </body>
</html>
