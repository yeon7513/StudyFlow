<!doctype html>
<html
  lang="ko"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{/layout/layout}"
>
  <head>
    <title layout:fragment="title">스터디 플로우 - 사전예약</title>
    <th:block layout:fragment="css">
      <link rel="stylesheet" href="/css/preorder/select_keywords.css" />
    </th:block>
    <th:block layout:fragment="js">
      <script defer src="/js/preorder/select_keywords.js"></script>
    </th:block>
  </head>
  <body>
    <section layout:fragment="container">
      <form id="register-reservation" class="content">
        <ul>
          <li th:each="keywords : ${keywords}">
            <h3 th:text="${keywords.name}">카테고리명</h3>
            <div
              th:each="keyword : ${keywords.keywordInfo}"
              class="select-content"
            >
              <!-- 키워드 선택 -->
              <label th:for="|kwdno_${keyword.kwdNo}|" class="category">
                <input
                  type="checkbox"
                  th:id="|kwdno_${keyword.kwdNo}|"
                  name="kwdNo"
                  th:value="${keyword.kwdNo}"
                />
                <span th:text="|${keyword.name} - ${keyword.description}|">
                  키워드명 - 키워드 설명
                </span>
              </label>

              <!-- 본인의 실력 선택 -->
              <div class="select-level" th:data-kwdno="${keyword.kwdNo}">
                <div class="level-content">
                  <input
                    th:id="|${keyword.kwdNo}_beginner|"
                    type="radio"
                    th:name="|${keyword.kwdNo}_studyLevel|"
                    value="입문"
                    disabled
                  />
                  <label th:for="|${keyword.kwdNo}_beginner|">입문</label>
                </div>
                <div class="level-content">
                  <input
                    th:id="|${keyword.kwdNo}_novice|"
                    type="radio"
                    th:name="|${keyword.kwdNo}_studyLevel|"
                    value="초급"
                    disabled
                  />
                  <label th:for="|${keyword.kwdNo}_novice|">초급</label>
                </div>
                <div class="level-content">
                  <input
                    th:id="|${keyword.kwdNo}_intermediate|"
                    type="radio"
                    th:name="|${keyword.kwdNo}_studyLevel|"
                    value="중급"
                    disabled
                  />
                  <label th:for="|${keyword.kwdNo}_intermediate|">중급</label>
                </div>
                <div class="level-content">
                  <input
                    th:id="|${keyword.kwdNo}_advanced|"
                    type="radio"
                    th:name="|${keyword.kwdNo}_studyLevel|"
                    value="고급"
                    disabled
                  />
                  <label th:for="|${keyword.kwdNo}_advanced|">고급</label>
                </div>
              </div>
            </div>
          </li>
        </ul>
        <div class="btn-group">
          <!-- 최종 예약 정보를 전송 -->
          <button id="register-reserve-btn" class="btn" type="submit">
            사전예약하기
          </button>
          <button id="cancel" class="btn cancel" type="button">취소</button>
        </div>
      </form>
    </section>
  </body>
</html>
