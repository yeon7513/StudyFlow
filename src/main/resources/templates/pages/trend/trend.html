<!doctype html>
<html
  lang="ko"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{/layout/common/layout}"
>
  <head>
    <title layout:fragment="title">스터디 플로우 - 트렌드</title>
    <th:block layout:fragment="css">
      <link rel="stylesheet" href="/css/trend/trend.css" />
    </th:block>
    <script src="/js/trend/trend.js"></script>
  </head>
  <body>
    <section layout:fragment="container">
      <!-- 배너 -->
      <th:block
        th:replace="~{layout/common/fragments/Banner :: Banner(
					'TREND REPORT', 
					'지금 가장 뜨거운 학습 키워드', 
					'기초부터 심화까지! 나와 같은 레벨의 러너들이 가장 많이 찾는 분야'
				)}"
      >
      </th:block>

      <div class="content">
        <div class="loading">
          <p th:if="${topKeywords.isEmpty()}">데이터를 집계 중입니다.</p>
        </div>

        <ul class="top-keywords">
          <li th:each="keyword : ${topKeywords}">
            <div class="icon">
              <span th:text="${keyword.category}" class="category">
                카테고리
              </span>
              <p th:text="${keyword.name}" class="keyword">키워드</p>
              <div>
                <span th:text="${keyword.countKeyword}">집계 수</span>명 선택
              </div>
            </div>
          </li>
        </ul>
      </div>
    </section>
  </body>
</html>
