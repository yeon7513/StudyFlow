<!DOCTYPE html>
<html 
	lang="ko" 
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{/layout/layout}">
<head>
	<title layout:fragment="title">스터디 플로우 - 트렌드</title>
</head>
<body>
	<section layout:fragment="container">
		<div class="banner">
			<div class="flex-box inner">
				<h2>관심분야 선택</h2>
			</div>
		</div>
		
		<div class="content">
			<ul>
				<li th:each="category : ${categories}">
					<p th:text="${category.name}">카테고리명</p>
				</li>
			</ul>
		</div>
		
		<div>		
			<a href="/trend">이전</a>
		</div>
	</section>
</body>
</html>
