<!doctype html>
<html
  lang="ko"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{/layout/common/layout}"
>
  <head>
    <title layout:fragment="title">스터디 플로우 - 사전예약</title>
  </head>
  <body>
    <section layout:fragment="container">
      <!-- 배너 -->
      <th:block th:if="${result != null}">
        <th:block
          th:replace="~{layout/common/fragments/Banner :: Banner(
					'Perfect Match', 
					'나와 딱 맞는 스터디를 만날 준비 완료', 
					'사전예약 내역이 확인되었습니다.<br>정식 오픈 시, 나의 목표와 레벨에 꼭 맞는 스터디 메이트를 가장 먼저 매칭해 드릴게요.'
				)}"
        >
        </th:block>
      </th:block>
      <th:block th:if="${result == null}">
        <th:block
          th:replace="~{layout/common/fragments/Banner :: Banner(
					'New Connection', 
					'아직 맞춤형 스터디 매칭을 신청하지 않으셨네요!', 
					'조회된 사전예약 내역이 없습니다.<br>지금 관심 분야를 설정하시고, 정식 오픈 시 가장 먼저 나와 핏이 맞는 스터디 그룹을 추천받아 보세요.'
				)}"
        >
        </th:block>
      </th:block>

      <div>
        <div th:if="${result == null}">
          <h3>입력하신 정보와 일치하는 예약 내역이 없습니다.</h3>
          <p>이메일과 비밀번호를 다시 확인해주세요.</p>
          <a href="/reservation" class="btn">다시 검색</a>
          <a href="/reservation/reserve" class="btn">사전 예약</a>
        </div>

        <div th:if="${result != null}">
          <p th:text="${result.email}">이메일</p>
          <p th:text="${result.name}">예약자명</p>
          <p th:text="${result.phone}">연락처</p>
          <p th:text="${result.createdAt}">예약일</p>
          <ul th:if="${!result.selectedKeywords.isEmpty()}">
            <li th:each="keyword : ${result.selectedKeywords}">
              <span th:text="${keyword.keywordName}">키워드명</span>
              <span th:text="${keyword.studyLevel}">레벨</span>
            </li>
          </ul>
          <div>
            <a href="/" class="btn">메인페이지로 이동</a>
            <a href="/trend" class="btn">실시간 트렌드 확인하기</a>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
