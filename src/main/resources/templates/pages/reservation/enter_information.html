<!doctype html>
<html
  lang="ko"
  layout:decorate="~{/layout/common/layout}"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  xmlns:th="http://www.thymeleaf.org"
>
  <head>
    <title layout:fragment="title">스터디 플로우 - 사전예약</title>
    <link href="/css/reservation/reserve.css" rel="stylesheet" />
    <script defer src="/js/reservation/reserve.js"></script>
  </head>
  <body>
    <section layout:fragment="container">
      <th:block
        th:replace="~{layout/common/fragments/Banner :: Banner(
          'enter-information',
          '사전 예약',
          '얼리버드 한정 혜택 받기',
          '지금 사전예약하시면 ✨<strong>30% 할인 쿠폰</strong> + <strong>시크릿 리포트 PDF</strong> 등<br>총 3가지 독점 혜택을 정식 런칭 당일 100% 제공해 드립니다.'
        )}"
      >
      </th:block>

      <div class="row justify-content-center mt-4">
        <div class="col-12 col-md-9 col-lg-7">

          <form class="p-4 p-md-5 rounded-4 bg-white border shadow-sm text-start" id="user-info">
            <!-- 예약자 정보 입력 -->
            <h4 class="fw-bold mb-4 border-bottom pb-2 fs-5">
              <i class="bi bi-person-check-fill me-2 text-primary"></i>
              예약자 정보 입력
            </h4>

            <div class="mb-3">
              <label class="form-label fw-semibold small text-secondary" for="email">이메일 주소</label>
              <div class="input-group">
                <input
                  autocomplete="no-email"
                  class="form-control py-2.5"
                  id="email"
                  name="email"
                  placeholder="example@studyflow.com"
                  required
                  type="email"
                />
                <button class="btn btn-outline-primary px-4 fw-bold" type="button">중복 확인</button>
              </div>
            </div>

            <div class="form-floating mb-3">
              <input
                autocomplete="off"
                class="form-control"
                id="password"
                name="password"
                placeholder="비밀번호 입력"
                required
                type="password"
              />
              <label class="text-secondary" for="password">비밀번호 입력 (조회 시 사용)</label>
            </div>

            <div class="form-floating mb-3">
              <input
                autocomplete="no-name"
                class="form-control"
                id="name"
                name="name"
                placeholder="예약자명 입력"
                required
                type="text"
              />
              <label class="text-secondary" for="name">예약자명</label>
            </div>

            <div class="form-floating mb-4">
              <input
                autocomplete="off"
                class="form-control"
                id="phone"
                name="phone"
                placeholder="연락처 입력"
                required
                type="text"
              />
              <label class="text-secondary" for="phone">연락처 (ex: 010-0000-0000)</label>
            </div>

            <div class="mb-4">
              <label class="form-label fw-semibold small text-secondary" for="region">거주 지역</label>
              <select class="form-select py-2.5" id="region" name="region">
                <option th:each="option : ${formOptions.regions}"
                        th:text="${option.label}"
                        th:value="${option.value}"></option>
              </select>
            </div>

            <div class="mb-5">
              <label class="form-label fw-semibold small text-secondary d-block mb-2">STUDY FLOW를 어떻게 알게 되셨나요?</label>
              <div class="d-flex flex-wrap gap-3">
                <div class="form-check" th:each="option : ${formOptions.inflows}">
                  <input class="form-check-input"
                         name="inflow"
                         th:id="${option.value}"
                         th:value="${option.value}"
                         type="radio"
                  />
                  <label class="form-check-label text-dark small" th:for="${option.value}" th:text="${option.label}">
                    유입 경로 라벨
                  </label>
                </div>
              </div>
            </div>

            <div class="d-flex flex-column flex-sm-row gap-2 mt-4">
              <button class="btn btn-primary btn-lg w-100 py-3 fw-bold rounded-pill shadow" id="save-user-info"
                      type="button">
                관심 분야 선택하고 계속하기 <i class="bi bi-arrow-right-short"></i>
              </button>
              <a class="btn btn-light btn-lg w-100 w-sm-auto px-4 py-3 fw-bold rounded-pill border" href="/reservation">취소</a>
            </div>

          </form>

        </div>
      </div>
    </section>
  </body>
</html>
