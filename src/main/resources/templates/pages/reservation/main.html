<!doctype html>
<html
  lang="ko"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{/layout/common/layout}"
>
  <head>
    <title layout:fragment="title">스터디 플로우 - 사전예약</title>
    <link rel="stylesheet" href="/css/reservation/main.css" />
    <script defer src="/js/reservation/main.js"></script>
  </head>
  <body>
    <section layout:fragment="container">
      <!-- 배너 -->
      <th:block
        th:replace="~{layout/common/fragments/Banner :: Banner(
					'Customized Report', 
					'내 커리어를 레벨업 할 맞춤형 리포트', 
					'지금 어떤 분야의 성장을 원하시나요?<br>관심 분야를 설정하시면, 나의 다음 스텝에 딱 맞는 학습 로드맵과 사전예약 특별 혜택을 안내해 드립니다.'
				)}"
      >
      </th:block>

      <div class="contents">
        <!-- 사전 예약 페이지로 이동 -->
        <div class="reserve-intro">
          <a href="/reservation/reserve" class="btn">사전예약하기</a>
        </div>

        <!-- 예약 정보 찾기 -->
        <div class="form-wrap">
          <form
            id="search-preorder-info"
            method="post"
            action="/reservation/search_result"
          >
            <div class="input-group">
              <input
                id="email"
                class="text-field"
                type="email"
                name="email"
                placeholder="이메일 입력"
                autocomplete="no-email"
                required
              />
              <label for="email" class="text-label">이메일</label>
            </div>
            <div class="input-group">
              <input
                id="password"
                class="text-field"
                type="password"
                name="password"
                placeholder="비밀번호 입력"
                autocomplete="off"
                required
              />
              <label for="password" class="text-label">비밀번호</label>
            </div>
            <div>
              <button type="submit" class="btn">예약 정보 조회</button>
            </div>
          </form>
        </div>
      </div>
    </section>
  </body>
</html>
