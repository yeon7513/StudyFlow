<!doctype html>
<html
  lang="ko"
  layout:decorate="~{/layout/common/layout}"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  xmlns:th="http://www.thymeleaf.org"
>
  <head>
    <title layout:fragment="title">스터디 플로우 - 사전예약</title>
    <link href="/css/reservation/main.css" rel="stylesheet" />
  </head>
  <body>
    <section layout:fragment="container">
      <!-- 배너 -->
      <th:block
        th:replace="~{layout/common/fragments/Banner :: Banner(
          'reservation',
					'Customized Report', 
					'내 커리어를 레벨업 할 맞춤형 리포트', 
					'지금 어떤 분야의 성장을 원하시나요?<br>관심 분야를 설정하시면, 나의 다음 스텝에 딱 맞는 학습 로드맵과 사전예약 특별 혜택을 안내해 드립니다.'
				)}"
      >
      </th:block>

      <div class="container-lg my-5">
        <div class="row g-4 align-items-stretch justify-content-center">

          <!-- 사전예약 CTA -->
          <div class="col-12 col-md-6">
            <div
              class="p-4 p-md-5 rounded-4 bg-light border shadow-sm h-100 d-flex flex-column justify-content-between text-start">
              <div>
                <span class="badge bg-primary mb-2">LAUNCHING SOON</span>
                <h3 class="fw-bold fs-3 mb-3 text-dark">지금 사전예약하고<br>특별한 혜택과 함께 시작하세요!</h3>

                <p class="text-secondary mb-4 lh-base">
                  STUDY FLOW와 함께라면 당신의 학습 데이터가 트렌드가 됩니다.
                  지금 사전예약에 참여하시면 얼리버드 30% 할인 쿠폰과 시크릿 가이드북 리포트를 전송해 드립니다.
                </p>
              </div>

              <div class="mt-4">
                <a class="btn btn-primary btn-lg w-100 py-3 fw-bold rounded-pill shadow"
                   href="/reservation/enter_information">
                  지금 바로 사전예약하기 <i class="bi bi-arrow-right-short"></i>
                </a>
              </div>
            </div>
          </div>

          <!-- 예약 정보 조회 -->
          <div class="col-12 col-md-6">
            <div
              class="p-4 p-md-5 rounded-4 bg-white border shadow-sm h-100 d-flex flex-column justify-content-between">

              <h3 class="fw-bold fs-4 mb-4 text-center">내 예약 정보 조회</h3>

              <form action="/reservation/search_result" id="search-preorder-info" method="post">

                <div class="form-floating mb-3">
                  <input
                    autocomplete="no-email"
                    class="form-control"
                    id="email"
                    name="email"
                    placeholder="name@example.com"
                    required
                    type="email"
                  />
                  <label class="text-secondary" for="email">이메일 주소</label>
                </div>

                <div class="form-floating mb-4">
                  <input
                    autocomplete="off"
                    class="form-control"
                    id="password"
                    name="password"
                    placeholder="비밀번호"
                    required
                    type="password"
                  />
                  <label class="text-secondary" for="password">비밀번호</label>
                </div>

                <div>
                  <button class="btn btn-outline-secondary btn-lg w-100 py-3 fw-bold rounded-pill" type="submit">
                    예약 정보 조회 <i class="bi bi-search small ms-1"></i>
                  </button>
                </div>

              </form>

            </div>
          </div>

        </div>
      </div>
    </section>
  </body>
</html>
