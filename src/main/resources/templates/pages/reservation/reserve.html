<!doctype html>
<html
  lang="ko"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{/layout/layout}"
>
  <head>
    <title layout:fragment="title">스터디 플로우 - 사전예약</title>
    <link rel="stylesheet" href="/css/preorder/reserve.css" />
    <script defer src="/js/preorder/reserve.js"></script>
  </head>
  <body>
    <section layout:fragment="container">
      <th:block
        th:replace="~{layout/fragments/Banner :: Banner(
          '사전 예약', 
          '내 커리어를 레벨업 할 맞춤형 리포트', 
          '지금 어떤 분야의 성장을 원하시나요?<br>관심 분야를 설정하시면, 나의 다음 스텝에 딱 맞는 학습 로드맵과 사전예약 특별 혜택을 안내해 드립니다.'
        )}"
      >
      </th:block>
      <!-- 예약자 정보 입력 -->
      <form id="user-info">
        <div class="input-group">
          <input
            id="email"
            class="text-field"
            type="email"
            name="email"
            placeholder="이메일 입력"
            autocomplete="no-email"
          />
          <label for="email" class="text-label">이메일</label>
        </div>
        <div class="input-group">
          <input
            id="password"
            class="text-field"
            type="password"
            name="password"
            placeholder="비밀번호 입력"
            autocomplete="off"
          />
          <label for="password" class="text-label">비밀번호</label>
        </div>
        <div class="input-group">
          <input
            id="name"
            class="text-field"
            type="text"
            name="name"
            placeholder="예약자명 입력"
            autocomplete="no-name"
          />
          <label for="name" class="text-label">예약자명</label>
        </div>
        <div class="input-group">
          <input
            id="phone"
            class="text-field"
            type="text"
            name="phone"
            placeholder="연락처 입력"
            autocomplete="off"
          />
          <label for="phone" class="text-label">연락처</label>
        </div>

        <!-- 지역 -->
        <div>
          <select name="region" id="region">
            <option value="">지역 선택</option>
            <option value="서울/인천">서울/인천</option>
            <option value="경기">경기</option>
            <option value="강원">강원</option>
            <option value="충북">충북</option>
            <option value="충남">충남</option>
            <option value="대전/세종">대전/세종</option>
            <option value="전북">전북</option>
            <option value="전남">전남</option>
            <option value="광주">광주</option>
            <option value="경북">경북</option>
            <option value="경남">경남</option>
            <option value="대구/부산">대구/부산</option>
            <option value="제주">제주</option>
          </select>
        </div>

        <!-- 유입 경로 -->
        <div>
          <label for="community">
            <input id="community" type="radio" name="inflow" value="커뮤니티" />
            커뮤니티
          </label>

          <label for="facebook">
            <input id="facebook" type="radio" name="inflow" value="페이스북" />
            페이스북
          </label>
          <label for="insta">
            <input id="insta" type="radio" name="inflow" value="인스타그램" />
            인스타그램
          </label>
          <label for="acquaintance">
            <input
              id="acquaintance"
              type="radio"
              name="inflow"
              value="지인 추천"
            />
            지인 추천
          </label>
          <label for="blog">
            <input id="blog" type="radio" name="inflow" value="블로그 검색" />
            블로그 검색
          </label>
          <label for="extra">
            <input id="extra" type="radio" name="inflow" value="기타" />
            기타
          </label>
        </div>
        <div>
          <button id="save-user-info" type="button" class="btn">
            관심 분야 선택
          </button>
          <a href="/preorder" class="btn cancel">취소</a>
        </div>
      </form>
    </section>
  </body>
</html>
