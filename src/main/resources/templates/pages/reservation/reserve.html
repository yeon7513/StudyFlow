<!doctype html>
<html
  lang="ko"
  layout:decorate="~{/layout/common/layout}"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  xmlns:th="http://www.thymeleaf.org"
>
  <head>
    <title layout:fragment="title">스터디 플로우 - 사전예약</title>
    <link href="/css/reservation/reserve.css" rel="stylesheet" />
    <script defer src="/js/reservation/reserve.js"></script>
  </head>
  <body>
    <section layout:fragment="container">
      <th:block
        th:replace="~{layout/common/fragments/Banner :: Banner(
          '사전 예약', 
          '내 커리어를 레벨업 할 맞춤형 리포트', 
          '지금 어떤 분야의 성장을 원하시나요?<br>관심 분야를 설정하시면, 나의 다음 스텝에 딱 맞는 학습 로드맵과 사전예약 특별 혜택을 안내해 드립니다.'
        )}"
      >
      </th:block>

      <!-- 예약자 정보 입력 -->
      <form id="user-info">
        <div>
          <div class="input-group">
            <input
              autocomplete="no-email"
              class="text-field"
              id="email"
              name="email"
              placeholder="이메일 입력"
              type="email"
            />
            <label class="text-label" for="email">이메일</label>
          </div>
          <button class="btn" type="button">중복 확인</button>
        </div>
        <div class="input-group">
          <input
            autocomplete="off"
            class="text-field"
            id="password"
            name="password"
            placeholder="비밀번호 입력"
            type="password"
          />
          <label class="text-label" for="password">비밀번호</label>
        </div>
        <div class="input-group">
          <input
            autocomplete="no-name"
            class="text-field"
            id="name"
            name="name"
            placeholder="예약자명 입력"
            type="text"
          />
          <label class="text-label" for="name">예약자명</label>
        </div>
        <div class="input-group">
          <input
            autocomplete="off"
            class="text-field"
            id="phone"
            name="phone"
            placeholder="연락처 입력"
            type="text"
          />
          <label class="text-label" for="phone">연락처</label>
        </div>

        <!-- 지역 -->
        <div>
          <select id="region" name="region">
            <option th:each="option : ${formOptions.regions}" th:text="${option.label}"
                    th:value="${option.value}"></option>
          </select>
        </div>

        <!-- 유입 경로 -->
        <div>
          <label th:each="option : ${formOptions.inflows}" th:for="${option.value}">
            <input name="inflow" th:id="${option.value}" th:value="${option.value}" type="radio" />
            <span th:text="${option.label}"></span>
          </label>
        </div>
        <div>
          <button class="btn" id="save-user-info" type="button">
            관심 분야 선택
          </button>
          <a class="btn cancel" href="/reservation">취소</a>
        </div>
      </form>
    </section>
  </body>
</html>
