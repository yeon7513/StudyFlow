<!doctype html>
<html
  lang="ko"
  layout:decorate="~{/layout/common/layout}"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  xmlns:th="http://www.thymeleaf.org"
>
  <head>
    <title layout:fragment="title">스터디 플로우 - 사전예약</title>
  </head>
  <body>
    <div layout:fragment="container">
      <!-- 배너 -->
      <th:block
        th:replace="~{layout/common/fragments/banner :: Banner(
          'reservation-completed',
					'Ready to Run', 
					'성공적인 커리어 점프를 위한 준비 완료', 
					'성공적으로 사전예약이 완료되었습니다.<br>나만의 맞춤형 학습 로드맵과 특별 혜택이 준비되는 대로 가장 먼저 알려드릴게요.'
				)}"
      >
      </th:block>

      <div class="container-lg my-5">
        <div class="row justify-content-center">
          <div class="col-12 col-md-8 col-lg-6">

            <!-- 축하/완료 메시지 영역 -->
            <div class="text-center mb-5">
              <i class="bi bi-check-circle-fill text-primary" style="font-size: 3.5rem;"></i>
              <h2 class="fw-bold mt-3 mb-2">사전예약이 완료되었습니다!</h2>
              <p class="text-secondary">신청해주신 예약 정보와 관심 분야 내역입니다.</p>
            </div>

            <!-- 예약 정보 확인 카드 -->
            <div class="card border border-light-subtle shadow-sm rounded-4 overflow-hidden mb-5">
              <div class="card-body p-4 p-md-5">

                <!-- 기본 정보 영역 -->
                <h4 class="fw-bold mb-4 border-bottom pb-2 fs-5">
                  <i class="bi bi-person-vcard-fill me-2 text-secondary"></i>예약자 정보
                </h4>

                <ul class="list-unstyled mb-5">
                  <li class="d-flex justify-content-between align-items-center py-3 border-bottom border-light">
                    <span class="text-secondary fw-semibold">이메일</span>
                    <span class="fw-bold text-dark" th:text="${completedReservation.email}">이메일</span>
                  </li>
                  <li class="d-flex justify-content-between align-items-center py-3 border-bottom border-light">
                    <span class="text-secondary fw-semibold">예약자명</span>
                    <span class="fw-bold text-dark" th:text="${completedReservation.name}">예약자명</span>
                  </li>
                  <li class="d-flex justify-content-between align-items-center py-3 border-bottom border-light">
                    <span class="text-secondary fw-semibold">연락처</span>
                    <span class="fw-bold text-dark" th:text="${completedReservation.phone}">연락처</span>
                  </li>
                  <li class="d-flex justify-content-between align-items-center py-3 border-bottom border-light">
                    <span class="text-secondary fw-semibold">사전예약일</span>
                    <span class="fw-bold text-dark" th:text="${completedReservation.createdAt}">사전예약일</span>
                  </li>
                </ul>

                <!-- 선택한 관심 분야 영역 -->
                <h4 class="fw-bold mb-3 fs-5">
                  <i class="bi bi-bookmark-star-fill me-2 text-secondary"></i>선택한 관심 분야
                </h4>
                <div class="bg-light rounded-4 p-3 border border-light-subtle">
                  <ul class="list-unstyled mb-0 d-flex flex-column gap-2">

                    <li class="d-flex justify-content-between align-items-center bg-white p-3 rounded-3 border shadow-sm"
                        th:each="keyword : ${completedReservation.selectedKeywords}">
                      <!-- 키워드명 -->
                      <span class="fw-bold text-dark fs-6" th:text="${keyword.keywordName}">선택한 키워드명</span>
                      <!-- 선택한 레벨 (뱃지 형태) -->
                      <span class="badge bg-primary-subtle text-primary rounded-pill px-3 py-2 fw-bold"
                            th:text="${keyword.studyLevel}">레벨</span>
                    </li>

                  </ul>
                </div>

              </div>
            </div>

            <!-- 메인페이지 이동 버튼 영역 -->
            <div class="text-center">
              <a href="/" class="btn btn-primary btn-lg px-5 py-3 fw-bold rounded-pill shadow w-100 w-md-auto">
                메인페이지로 돌아가기 <i class="bi bi-house-door-fill ms-1"></i>
              </a>
            </div>

          </div>
        </div>
      </div>
  </body>
</html>
