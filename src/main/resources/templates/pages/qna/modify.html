<!doctype html>
<html
  lang="ko"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{/layout/layout}"
>
  <head>
    <title layout:fragment="title">스터디 플로우 - 문의글 수정</title>
    <link rel="stylesheet" href="/css/qna/editor.css" />
    <script defer src="/js/qna/editor.js"></script>
  </head>
  <body>
    <section layout:fragment="container" id="write">
      <h3>게시글 수정</h3>
      <form
        method="post"
        id="modify-form"
        th:action="@{|/qna/modify/${prevPost.no}|}"
      >
        <div class="title">
          <input
            type="text"
            name="title"
            th:value="${prevPost.title}"
            placeholder="제목을 입력해주세요."
          />
          <input
            type="password"
            name="postPw"
            placeholder="비밀번호 입력 (미입력 시 기존 비밀번호로 유지됩니다.)"
          />
        </div>
        <div class="text">
          <textarea
            rows="20"
            name="text"
            th:text="${prevPost.text}"
            placeholder="내용을 입력해주세요."
          >
          </textarea>
        </div>
        <div>
          <button type="submit" class="btn">등록</button>
          <button id="cancel-button" type="button" class="btn cancel">
            취소
          </button>
        </div>
      </form>
    </section>
  </body>
</html>
