<!doctype html>
<html
  lang="ko"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{/layout/layout}"
>
  <head>
    <title layout:fragment="title">스터디 플로우 - Q&A</title>
    <th:block layout:fragment="css">
      <link rel="stylesheet" href="/css/qna/list.css" />
    </th:block>
  </head>
  <body>
    <section layout:fragment="container">
      <!-- 배너 -->
      <th:block
        th:replace="~{layout/fragments/Banner :: Banner('insight report', '무엇이든 물어보세요', '회원가입이나 로그인 없이 누구나 자유롭게 질문할 수 있습니다.<br>사전예약이나 서비스 이용에 대해 궁금한 점을 남겨주시면 빠르게 답변해 드립니다.')}"
      >
      </th:block>

      <!-- 검색 & 글쓰기 -->
      <div class="utils">
        <form class="search">
          <input
            type="text"
            name="searchKeyword"
            class="search-field"
            placeholder="검색어 입력"
          />
          <button type="submit" id="search-btn" class="btn">검색</button>
        </form>
        <a href="qna/write" class="btn">글쓰기</a>
      </div>

      <!-- 게시글 목록 -->
      <div id="board">
        <table id="post">
          <thead>
            <tr>
              <th>No.</th>
              <th>제목</th>
              <th>답변여부</th>
              <th>작성일</th>
            </tr>
          </thead>
          <tbody>
            <tr th:if="${questionPosts.isEmpty()}">
              <td colspan="4">
                <p>작성된 문의글이 없습니다.</p>
              </td>
            </tr>

            <tr
              th:each="qna : ${questionPosts}"
              th:if="${qna.isActive == true}"
            >
              <td class="num" th:text="${qna.no}">글번호</td>
              <td class="title">
                <a th:href="@{|qna/detail/${qna.no}|}" th:text="${qna.title}">
                  게시글 제목
                </a>
              </td>
              <td>
                <span
                  th:class="${qna.answerPost == null} ? 'status waiting' : 'status complete'"
                  th:text="${qna.answerPost == null} ? '미답변' : '답변완료'"
                  >답변 여부</span
                >
              </td>
              <td class="date" th:text="${qna.createdAt}">작성일</td>
            </tr>
          </tbody>

          <!-- 페이지네이션 
            th:if="${!questionPosts.isEmpty()}"
          -->
          <tfoot>
            <tr>
              <td colspan="4">
                <ul id="pagination">
                  <li>
                    <a th:href="@{|?page=1${pager.query}|}">
                      <i class="fa-solid fa-angles-left"></i>
                    </a>
                  </li>
                  <li>
                    <a th:href="@{|?page=${pager.prev}${pager.query}|}">
                      <i class="fa-solid fa-angle-left"></i>
                    </a>
                  </li>
                  <li th:each="page : ${pager.list}">
                    <a
                      th:href="@{|?page=${page}${pager.query}|}"
                      th:text="${page}"
                      th:class="${page == pager.page ? 'page-active' : ''}"
                      >0</a
                    >
                  </li>
                  <li>
                    <a th:href="@{|?page=${pager.next}${pager.query}|}">
                      <i class="fa-solid fa-angle-right"></i>
                    </a>
                  </li>
                  <li>
                    <a th:href="@{|?page=${pager.last}${pager.query}|}">
                      <i class="fa-solid fa-angles-right"></i>
                    </a>
                  </li>
                </ul>
              </td>
            </tr>
          </tfoot>
        </table>
      </div>
    </section>
  </body>
</html>
