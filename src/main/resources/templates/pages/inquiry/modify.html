<!doctype html>
<html
  lang="ko"
  layout:decorate="~{/layout/common/layout}"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  xmlns:th="http://www.thymeleaf.org"
>
  <head>
    <title layout:fragment="title">스터디 플로우 - 문의글 수정</title>
    <script defer src="/js/inquiry/editor.js"></script>
  </head>
  <body>
    <section class="container-lg my-5" id="write" layout:fragment="container">

      <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8">

          <div class="mb-4">
            <h2 class="fw-bold fs-3">게시글 수정</h2>
            <p class="text-secondary">문의하신 내용을 수정합니다.</p>
          </div>

          <form class="p-4 p-md-5 bg-white border shadow-sm rounded-4" id="modify-form" method="post"
                th:action="@{|/inquiry/modify/${prevPost.no}|}">

            <div class="row g-3 mb-4">
              <!-- 카테고리 선택 -->
              <div class="col-12 col-md-4">
                <label class="form-label fw-bold text-dark" for="category">문의 유형</label>
                <select class="form-select form-select-lg" id="category" name="category" required>
                  <option disabled selected value="">문의 유형 선택</option>
                  <option th:each="category : ${categoryOptions}"
                          th:selected="${category.value == prevPost.category}"
                          th:text="${category.label}"
                          th:value="${category.value}">
                  </option>
                </select>
              </div>
              <!-- 제목 입력 -->
              <div class="col-12 col-md-8">
                <label class="form-label fw-bold text-dark" for="title">제목</label>
                <input class="form-control form-control-lg" id="title" name="title"
                       placeholder="제목을 입력해주세요." required th:value="${prevPost.title}" type="text" />
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label fw-bold text-dark" for="postPw">비밀번호</label>
              <input class="form-control" id="postPw" name="postPw" placeholder="미입력 시 기존 비밀번호로 유지됩니다."
                     type="password" />
            </div>

            <div class="mb-5">
              <label class="form-label fw-bold text-dark" for="text">내용</label>
              <textarea class="form-control" id="text" name="text" placeholder="내용을 입력해주세요."
                        required rows="15" th:text="${prevPost.text}"></textarea>
            </div>

            <div class="d-flex gap-2">
              <button class="btn btn-primary btn-lg px-5 fw-bold rounded-pill shadow-sm" type="submit">
                수정 완료
              </button>
              <button class="btn btn-light btn-lg px-4 fw-bold rounded-pill border" id="cancel-button" type="button">
                취소
              </button>
            </div>

          </form>
        </div>
      </div>
    </section>
  </body>
</html>
