<!doctype html>
<html
  lang="ko"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{/layout/layout}"
>
  <head>
    <title layout:fragment="title">스터디 플로우 - 관리자 로그인</title>
  </head>
  <body>
    <div layout:fragment="content">
      <h2>admin - login.html</h2>
      <p>관리자 로그인 페이지</p>
      <form
        id="search-preorder-info"
        method="post"
        action="/preorder/search_result"
      >
        <div class="input-group">
          <input
            id="email"
            class="text-field"
            type="email"
            name="email"
            placeholder="이메일 입력"
            autocomplete="no-email"
            required
          />
          <label for="email" class="text-label">이메일</label>
        </div>
        <div class="input-group">
          <input
            id="password"
            class="text-field"
            type="password"
            name="password"
            placeholder="비밀번호 입력"
            autocomplete="off"
            required
          />
          <label for="password" class="text-label">비밀번호</label>
        </div>
        <div>
          <button type="submit" class="btn">예약 정보 조회</button>
        </div>
      </form>
    </div>
  </body>
</html>
