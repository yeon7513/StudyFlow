<!doctype html>
<html
  lang="ko"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  xmlns:th="http://www.thymeleaf.org"
>
  <head>
    <th:block th:replace="~{layout/common/fragments/config :: Config}">
    </th:block>
    <title layout:fragment="title">스터디 플로우 - 관리자</title>
    <link href="/css/admin/dashboard.css" rel="stylesheet" />
    <script defer src="/js/admin/common.js"></script>
  </head>

  <body>
    <div class="d-flex" id="dashboard-wrap">

      <div th:replace="~{layout/admin/fragments/global/sidebar :: Sidebar}"></div>

      <div class="d-flex flex-column flex-grow-1">

        <div th:replace="~{layout/admin/fragments/global/header :: Header(breadCrumb=${breadCrumbs})}"></div>

        <main class="p-4 flex-grow-1">
          <th:block layout:fragment="container"></th:block>
        </main>

      </div>
    </div>
  </body>
</html>
