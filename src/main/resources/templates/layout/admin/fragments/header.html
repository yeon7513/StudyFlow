<!doctype html>
<html
  lang="ko"
  th:fragment="Header"
  xmlns:th="http://www.thymeleaf.org"
>
  <header>
    <ul class="bread-crumb">
      <li>
        <a href="/admin_dashboard">
          <i class="fa-solid fa-house"></i>
        </a>
      </li>

      <!--
        타임리프 반복의 상태변수 -> 변수명+Stat
        참고 : https://jddng.tistory.com/233
      -->
      <th:block th:if="${breadCrumbs != null}">
        <li th:each="menu, menuStat : ${breadCrumbs}">
          <i class="fa-solid fa-chevron-right"></i>
          <a
            th:href="${menu.path}"
            th:if="${menu.path != null}"
            th:text="${menu.label}"
          >
            브레드크럼명
          </a>

          <!-- 마지막 브레드크럼일 경우, 링크 X -->
          <span
            th:class="${menuStat.last} ? 'active-page' : ''"
            th:if="${menu.path == null or menu.path == ''}"
            th:text="${menu.label}"
          >
            현재 보고 있는 페이지
          </span>
        </li>
      </th:block>
    </ul>
    <ul class="utils">
      <li>
        <a class="btn" href="/">
          <span class="util-text">사용자 모드 전환</span>
          <span class="util-icon"><i class="fa-solid fa-arrow-right-arrow-left"></i></span>
        </a>
      </li>
      <li>
        <a class="btn cancel" href="/admin/auth/logout">
          <span class="util-text">로그아웃</span>
          <span class="util-icon"><i class="fa-solid fa-right-from-bracket"></i></span>
        </a>
      </li>
    </ul>
  </header>
</html>
