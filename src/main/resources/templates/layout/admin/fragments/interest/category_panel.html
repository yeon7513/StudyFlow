<!doctype html>
<html
  lang="ko"
  th:fragment="CategoryPanel"
  xmlns:th="http://www.thymeleaf.org"
>
  <button
    class="btn btn-primary mb-4"
    data-bs-target="#categoryModal"
    data-bs-toggle="modal"
    type="button">
    새 카테고리 등록
  </button>

  <div class="table-responsive">
    <table class="table table-hover align-middle">
      <thead class="table-light">
        <tr>
          <th>No.</th>
          <th>카테고리명</th>
          <th>등록 관리자</th>
          <th>활성 상태</th>
          <th>등록일</th>
          <th>수정일</th>
        </tr>
      </thead>
      <tbody>
        <tr class="panel-item" th:each="category : ${categories}">
          <td th:text="${category.no}"></td>
          <td class="category-name"
              style="cursor:pointer;"
              th:data-category-name="${category.name}"
              th:data-category-no="${category.no}">
            [[${category.name}]] <i class="fa-regular fa-pen-to-square ms-2 text-primary"></i>
          </td>
          <td th:text="${category.adminId}"></td>
          <td>
            <div class="form-check form-switch">
              <input class="form-check-input" name="categoryState" role="switch"
                     th:checked="${category.isActive}"
                     th:data-category-no="${category.no}"
                     th:id="|switch${category.no}|"
                     type="checkbox">
              <label class="form-check-label" th:for="|switch${category.no}|"
                     th:text="${category.isActive ? '활성' : '비활성'}"></label>
            </div>
          </td>
          <td th:text="${category.createdAt}"></td>
          <td class="updated-at" th:text="${category.updatedAt ?: '-'}"></td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- 새 카테고리 등록 모달 -->
  <div aria-hidden="true" aria-labelledby="categoryModalLabel" class="modal fade" id="categoryModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow rounded-4">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title fw-bold">카테고리 등록</h5>
          <button class="btn-close" data-bs-dismiss="modal" type="button"></button>
        </div>

        <div class="modal-body">
          <form id="register-category-form" method="post" th:action="@{/admin/management/interest/category/register}">
            <div class="mb-3">
              <label class="form-label text-secondary">카테고리명</label>
              <input class="form-control" name="name" placeholder="카테고리명을 입력하세요" required type="text" />
            </div>

            <div class="mb-3">
              <label class="form-label text-secondary">활성 상태</label>
              <div class="form-check form-switch fs-5">
                <input checked class="form-check-input" id="isActiveSwitch" name="active" type="checkbox">
                <label class="form-check-label" for="isActiveSwitch">활성</label>
              </div>
            </div>

            <div class="modal-footer border-0 pt-0">
              <button class="btn btn-secondary" data-bs-dismiss="modal" type="button">취소</button>
              <button class="btn btn-primary" id="register-category" type="submit">등록</button>
            </div>
          </form>
        </div>

      </div>
    </div>
  </div>

</html>
