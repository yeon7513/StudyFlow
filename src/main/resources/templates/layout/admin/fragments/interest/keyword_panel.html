<!doctype html>
<html
  lang="ko"
  th:fragment="KeywordPanel"
  xmlns:th="http://www.thymeleaf.org"
>

  <button
    class="btn btn-primary mb-4"
    data-bs-target="#keywordModal"
    data-bs-toggle="modal"
    type="button">
    새 키워드 등록
  </button>

  <ul class="panel-content" id="keyword-panel">
    <li class="panel-header">
      <div>No.</div>
      <div>카테고리</div>
      <div>키워드명</div>
      <div>활성 상태</div>
      <div>등록일</div>
      <div>관리</div>
    </li>
    <li class="panel-item" th:each="keyword : ${keywords}">
      <div th:text="${keyword.no}"></div>
      <div class="category-name" th:text="${keyword.categoryName}"></div>
      <div class="keyword-name" th:text="${keyword.name}"></div>

      <div class="switch-wrapper">
        <input
          class="switch"
          name="keywordState"
          th:checked="${keyword.isActive}"
          th:data-keyword-no="${keyword.no}"
          th:id="|${keyword.no}_switch|"
          type="checkbox">
        <label th:for="|${keyword.no}_switch|">
          <span class="switch-x-toggletext">
            <span class="switch-x-unchecked"><span class="switch-x-hiddenlabel">Unchecked: </span>비활성</span>
            <span class="switch-x-checked"><span class="switch-x-hiddenlabel">Checked: </span>활성</span>
          </span>
        </label>
      </div>

      <div th:text="${keyword.createdAt}">키워드 생성일</div>

      <div>
        <input class="detail-toggle-checkbox"
               th:data-keyword-no="${keyword.no}"
               th:id="|detail-toggle-${keyword.no}|"
               type="checkbox">
        <label class="detail-toggle-label" th:for="|detail-toggle-${keyword.no}|">
          <span class="text-open">상세 조회 <i class="fa-solid fa-caret-down"></i></span>
          <span class="text-close" style="display: none;">닫기 <i class="fa-solid fa-caret-up"></i></span>
        </label>

      </div>

      <div class="keyword-expand-box"></div>
    </li>
  </ul>

  <!-- 새 키워드 등록 모달 -->
  <div aria-hidden="true" aria-labelledby="keywordModalLabel" class="modal fade" id="keywordModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow rounded-4">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title fw-bold">키워드 등록</h5>
          <button class="btn-close" data-bs-dismiss="modal" type="button"></button>
        </div>

        <div class="modal-body">
          <form method="post" th:action="@{/admin/management/interest/keyword/register}">
            <div class="mb-3">
              <select name="cateNo">
                <option th:each="option : ${categoryOptions}" th:text="${option.name}" th:value="${option.no}"></option>
              </select>

            </div>

            <div class="mb-3">
              <label class="form-label text-secondary">키워드명</label>
              <input class="form-control" name="name" placeholder="키워드를 입력하세요" required type="text" />
            </div>

            <div class="mb-3">
              <label class="form-label text-secondary">상세 설명</label>
              <textarea class="form-control" name="description" placeholder="상세 설명을 입력하세요"></textarea>
            </div>

            <div class="mb-3">
              <label class="form-label text-secondary">활성 상태</label>
              <div class="form-check form-switch fs-5">
                <input checked class="form-check-input" id="isActiveSwitch" name="active" type="checkbox">
                <label class="form-check-label" for="isActiveSwitch">활성</label>
              </div>
            </div>

            <div class="modal-footer border-0 pt-0">
              <button class="btn btn-secondary" data-bs-dismiss="modal" type="button">취소</button>
              <button class="btn btn-primary" id="register-keyword" type="submit">등록</button>
            </div>
          </form>
        </div>

      </div>
    </div>
  </div>

</html>
