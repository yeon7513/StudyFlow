<!doctype html>
<html
  lang="ko"
  layout:decorate="~{/layout/admin/dashboard}"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  xmlns:th="http://www.thymeleaf.org"
>
  <div th:fragment="modifyForm(detail)">
    <form class="p-4 bg-light border-bottom modify-form" th:data-target-id="${detail.id}"
          th:id="|modify-form-${detail.id}|">
      <div>

        <div class="mb-4 row align-items-center">
          <label class="col-sm-3 col-md-2 col-form-label fw-bold" th:for="|id_${detail.id}|">아이디</label>
          <div class="col-sm-9 col-md-6">
            <input class="form-control-plaintext text-secondary" readonly th:id="|id_${detail.id}|"
                   th:value="${detail.id}" type="text">
          </div>
        </div>

        <div class="mb-4 row align-items-center">
          <label class="col-sm-3 col-md-2 col-form-label fw-bold" th:for="|name_${detail.id}|">이름</label>
          <div class="col-sm-9 col-md-6">
            <input class="form-control-plaintext text-secondary" readonly th:id="|name_${detail.id}|"
                   th:value="${detail.name}" type="text">
          </div>
        </div>

        <div class="mb-4 row d-flex align-items-center">
          <div class="col-sm-3 col-md-2 fw-bold">접근 권한</div>

          <div class="col-sm-9 col-md-10 d-flex gap-3 flex-wrap role-group">

            <div class="form-check" th:each="role : ${roleOptions}">

              <!-- 최고관리자면 나머지 권한들 비활성화 -->
              <input class="form-check-input"
                     name="roles"
                     th:checked="${detail.role != null and detail.role.contains(role.value)}"
                     th:classappend="${role.name() == 'SUPER' ? 'super-check' : 'sub-check'}"
                     th:disabled="${role.name() != 'SUPER' and detail.role != null and detail.role.contains('ROLE_SUPER')}"
                     th:id="${role.name()} + '_' + ${detail.id}"
                     th:value="${role.value}"
                     type="checkbox">

              <label class="form-check-label"
                     th:classappend="${role.name() == 'SUPER'} ? 'text-danger fw-bold' : ''"
                     th:for="${role.name()} + '_' + ${detail.id}"
                     th:text="${role.label}">
                권한이름
              </label>

            </div>

          </div>
        </div>

        <!-- 활성 상태 -->
        <div class="mb-4 row align-items-center">
          <label class="col-sm-3 col-md-2 col-form-label fw-bold">상태</label>
          <div class="col-sm-9 col-md-10 pt-1">
            <div class="form-check form-switch p-0 m-0">
              <input class="form-check-input m-0" name="active" role="switch"
                     style="cursor: pointer; width: 40px; height: 20px;" th:checked="${detail.active}"
                     th:id="|active_switch_${detail.id}|"
                     type="checkbox">
            </div>
          </div>
        </div>

      </div>

      <div class="text-center pt-3 mt-3" style="border-top: 1px solid #dee2e6;">
        <button class="btn btn-outline-secondary px-4 me-2" data-bs-toggle="collapse"
                th:data-bs-target="'#modify-' + ${admin.id}" type="button">닫기
        </button>
        <button class="btn btn-primary px-4 modify-button" type="button">저장</button>
      </div>
    </form>
  </div>
</html>
