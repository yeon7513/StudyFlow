<!doctype html>
<html
  lang="ko"
  xmlns:th="http://www.thymeleaf.org"
>
  <th:block th:fragment="InquiryDetail">
    <div class="contents question">
      <div class="title">
        <span th:text="${inquiryDetail.no}">문의글 번호</span>
        <h3 th:text="${inquiryDetail.title}">문의글 제목</h3>
        <p th:text="${inquiryDetail.createdAt}">날짜</p>
      </div>
      <p th:text="${inquiryDetail.text}">본문내용</p>
    </div>

    <!-- 등록된 답변이 있을 시 등록된 답변글 렌더링 -->
    <div class="contents answer" th:if="${inquiryDetail.isAnswered == true}">
      <div>
        <div th:text="${inquiryDetail.answerPost?.adminId}">답변을 작성한 관리자</div>
        <div th:text="${inquiryDetail.answerPost?.answeredAt}">작성날짜</div>
      </div>
      <div>
        <p th:text="${inquiryDetail.answerPost?.answeredText}">답변 작성 내용</p>
      </div>
    </div>

    <!-- 등록된 답변이 없을 시 답변 입력 활성화 -->
    <div
      class="contents"
      id="reply"
      th:if="${inquiryDetail.isAnswered == false}"
    >
      <div>
        <div
          th:if="${!session.isEmpty()}"
          th:text="${session.logined_admin.id}"
        >
          현재 로그인 한 관리자 아이디
        </div>
      </div>
      <div>
        <textarea id="answered-text" name="answeredText"></textarea>
        <button id="reply-register-button" th:data-target-no="${inquiryDetail.no}" type="button">등록</button>
      </div>
    </div>
  </th:block>
</html>
