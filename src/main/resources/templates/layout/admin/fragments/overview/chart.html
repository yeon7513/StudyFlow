<!doctype html>
<html
  lang="ko"
  th:fragment="Chart"
  xmlns:th="http://www.thymeleaf.org"
>
  <div id="chart">
    <div class="wrap service-chart">
      <div class="chart-content new-reserve">
        <h3 class="overview-title">신규 예약자</h3>
        <div class="new-reserve-filter">
          <span>날짜 선택</span>
          <select id="date-range" name="range">
            <option value="7">7일</option>
            <option value="14">14일</option>
            <option value="30">30일</option>
          </select>
        </div>
        <canvas id="new-reserve-chart"></canvas>
      </div>
      <div class="chart-content selected-keyword">
        <h3 class="overview-title">선택된 관심 분야</h3>
        <canvas id="selected-keyword-chart"></canvas>
      </div>
    </div>

    <div class="wrap map-chart">
      <div class="chart-content inflow">
        <h3 class="overview-title">유입경로</h3>
        <canvas id="inflow-chart"></canvas>
      </div>
      <div class="chart-content region">
        <h3 class="overview-title">지역</h3>
        <canvas id="region-chart"></canvas>
      </div>
    </div>

    <div class="wrap inquiry-chart">
      <div class="chart-content new-inquiries">
        <h3 class="overview-title">새로 등록된 처리할 문의글</h3>
        <div>테이블</div>
      </div>
      <div class="chart-content inquiry-category">
        <h3 class="overview-title">문의글 카테고리 (어떤 문의 카테고리가 많이 들어왔는지)</h3>
        <canvas id="inquiry-category-chart"></canvas>
      </div>
    </div>
  </div>
</html>
