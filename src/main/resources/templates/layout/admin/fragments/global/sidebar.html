<!doctype html>
<html
  lang="ko"
  th:fragment="Sidebar"
  xmlns:th="http://www.thymeleaf.org"
>
  <div id="sidebar">
    <!-- 현재 접속한 운영자 정보 -->
    <div class="profile">
      <h1 class="logo">
        <a href="/admin_dashboard">
          <span>S</span>TUDY <span>F</span>LOW
          <small>관리자 모드</small>
        </a>
      </h1>
      <div class="admin-info" th:if="${!session.isEmpty()}">
        <p th:text="${session.logined_admin.id}">관리자 아이디</p>
        <div class="name">
          <span th:text="${session.logined_admin.name}">이름</span>
          <span th:text="${session.logined_admin.role}">권한(직급)</span>
        </div>
      </div>
      <ul class="profile-util">
        <li>
          <!-- 정보수정 -->
          <a href=""><i class="fa-solid fa-gear"></i></a>
        </li>
        <li>
          <!-- 사이드바 숨기기 -->
          <button id="toggle-sidebar-button" type="button"><i class="fa-solid fa-bars"></i></button>
        </li>
      </ul>
    </div>

    <!-- 사이드바 메뉴 -->
    <nav>
      <ul class="main-menu">
        <li>
          <a href="/admin_dashboard">
            <span class="menu-text">운영현황</span>
            <span class="menu-icon"><i class="fa-solid fa-house"></i></span>
          </a>
        </li>
        <li>
          <ul class="sub-menu">
            <li>
              <a href="/admin/management/reservation/list">
                <span class="menu-text">예약자 관리</span>
                <span class="menu-icon"><i class="fa-solid fa-user-group"></i></span>
              </a>
            </li>
            <li>
              <a href="/admin/management/inquiry/list">
                <span class="menu-text">문의 관리</span>
                <span class="menu-icon"><i class="fa-solid fa-circle-question"></i></span>
              </a>
            </li>
            <li>
              <a href="/admin/management/interest/list">
                <span class="menu-text">관심 분야 관리</span>
                <span class="menu-icon"><i class="fa-solid fa-icons"></i></span>
              </a>
            </li>
            <li>
              <a href="/admin/management/blacklist/list">
                <span class="menu-text">블랙리스트</span>
                <span class="menu-icon"><i class="fa-solid fa-user-slash"></i></span>
              </a>
            </li>
          </ul>
        </li>
        <!-- ROLE이 SUPER인 관리자만 -->
        <li>
          <ul class="sub-menu">
            <li>
              <a href="/admin/management/operator/list">
                <span class="menu-text">운영자 관리</span>
                <span class="menu-icon"><i class="fa-brands fa-black-tie"></i></span>
              </a>
            </li>
          </ul>
        </li>
        <!-- <li th:if="${session.logined_admin.role == 'SUPER'}">
          <ul class="sub-menu">
            <li>
              <a href="/admin/management/operator/list">운영자 관리</a>
            </li>
          </ul>
        </li> -->
      </ul>
    </nav>
  </div>
</html>
