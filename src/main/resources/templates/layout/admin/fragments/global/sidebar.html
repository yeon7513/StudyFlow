<!doctype html>
<html
  lang="ko"
  th:fragment="Sidebar"
  xmlns:th="http://www.thymeleaf.org"
>
  <aside id="sidebar" class="d-flex flex-column bg-white border-end vh-100 position-sticky top-0">

    <!-- 현재 접속한 관리자 프로필 -->
    <div class="profile p-3 border-bottom border-secondary">
      <h1 class="logo fs-5 mb-3">
        <a href="/admin_dashboard" class="text-decoration-none">
          <span class="text-primary">STUDY FLOW
          <small class="d-block text-secondary fs-6">관리자 모드</small>
        </a>
      </h1>

      <div class="admin-info small mb-2" th:if="${session.logined_admin != null}">
        <p class="mb-0 fw-bold" th:text="${session.logined_admin.id}">아이디</p>
          <p th:text="${session.logined_admin.name}">이름</p>
          <th:block th:each="role : ${session.logined_admin.rolesWithLabel}">
            <span class="badge fw-normal fs-6"
                  th:classappend="${role == '최고 관리자'} ? 'bg-danger' : 'bg-primary'"
                  th:text="${role}">권한</span>
          </th:block>
      </div>

      <ul class="profile-util list-unstyled d-flex gap-3 mb-0">
        <!-- 정보 수정 -->
        <li>
          <a href="#" class=>
            <i class="fa-solid fa-gear"></i>
          </a>
        </li>
        <!-- 사이드바 접기 -->
        <li>
          <button id="toggle-sidebar-button" type="button" class="btn btn-link p-0 border-0">
            <i class="fa-solid fa-bars"></i>
          </button>
        </li>
      </ul>
    </div>

    <!-- 사이드바 메뉴 -->
    <nav class="flex-grow-1 mt-3">
      <ul class="main-menu list-unstyled px-2">
        <li class="mb-2">
          <a href="/admin_dashboard" class="nav-link align-items-center">
            <i class="fa-solid fa-house me-3"></i>
            <span class="menu-text">운영현황</span>
          </a>
        </li>

        <li class="border-top border-secondary pt-3 mt-3">
          <ul class="sub-menu list-unstyled">
            <li class="mb-2"
                th:if="${(session.logined_admin.role.contains('ROLE_RESERVE') or session.logined_admin.role.contains('ROLE_SUPER'))}">
              <a href="/admin/management/reservation/list" class="nav-link">
                <i class="fa-solid fa-user-group me-3"></i>
                <span class="menu-text">예약자 관리</span>
              </a>
            </li>
            <li class="mb-2"
                th:if="${(session.logined_admin.role.contains('ROLE_INQUIRY') or session.logined_admin.role.contains('ROLE_SUPER'))}">
              <a href="/admin/management/inquiry/list" class="nav-link">
              <i class="fa-solid fa-circle-question me-3"></i>
              <span class="menu-text">문의 관리</span>
            </a>
            </li>
            <li class="mb-2"
                th:if="${(session.logined_admin.role.contains('ROLE_INTEREST') or session.logined_admin.role.contains('ROLE_SUPER'))}">
              <a href="/admin/management/interest/list" class="nav-link">
                <i class="fa-solid fa-icons me-3"></i>
                <span class="menu-text">관심 분야 관리</span>
              </a>
            </li>
            <li class="mb-2"
                th:if="${(session.logined_admin.role.contains('ROLE_BLACKLIST') or session.logined_admin.role.contains('ROLE_SUPER'))}">
              <a href="/admin/management/blacklist/list" class="nav-link">
                <i class="fa-solid fa-user-slash me-3"></i>
                <span class="menu-text">블랙리스트</span>
              </a>
            </li>
          </ul>
        </li>

        <li th:if="${session.logined_admin.role.contains('ROLE_SUPER')}" class="border-top border-secondary pt-3 mt-3">
              <ul class="sub-menu">
                <li class="mb-2">
                  <a href="/admin/management/operator/list" class="nav-link">
                    <i class="fa-brands fa-black-tie me-3"></i>
                    <span class="menu-text">
                      운영자 관리
                    </span>
                  </a>
                </li>
              </ul>
        </li>
      </ul>
    </nav>
  </aside>
</html>
