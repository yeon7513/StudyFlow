<!doctype html>
<html
  lang="ko"
  xmlns:th="http://www.thymeleaf.org"
>
  <form class="card mb-4 border-0 shadow-sm p-4" id="search-form" th:fragment="SearchForm(filters)">
    <div class="card-body">
      <th:block th:replace="${filters}"></th:block>

      <hr class="my-4">

      <div class="mb-3 d-flex flex-wrap gap-2" id="selected-filter"></div>

      <div class="d-flex justify-content-center gap-2">
        <button class="btn btn-outline-secondary px-4" id="reset-search-filter-btn" type="button">초기화</button>
        <button class="btn btn-primary px-4" type="submit">검색</button>
      </div>
    </div>
  </form>
</html>
