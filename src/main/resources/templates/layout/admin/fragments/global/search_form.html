<!doctype html>
<html
  lang="ko"
  xmlns:th="http://www.thymeleaf.org"
>
  <form id="search-form" th:fragment="SearchForm(filters)">
    <th:block th:replace="${filters}"></th:block>

    <ul id="selected-filter"></ul>

    <div class="search-btns">
      <!-- 필터 초기화 버튼 -->
      <button class="btn cancel" id="reset-search-filter-btn" type="button">
        초기화
      </button>
      <button class="btn" type="submit">
        검색
      </button>
    </div>
  </form>
</html>
