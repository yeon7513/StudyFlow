<!doctype html>
<html
  lang="ko"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
>
  <div th:fragment="Modal" id="modal">
    <form method="post" novalidate>
      <input type="hidden" id="postNo" name="no" th:value="${detail.no}" />
      <input type="hidden" id="postAction" name="action" />

      <div class="title">
        <h3>title</h3>
      </div>

      <div>
        <label for="password">
          게시글 작성 시 등록한 비밀번호를 입력해주세요.
        </label>
        <div class="field-group">
          <input
            type="password"
            id="password"
            name="postPw"
            placeholder="게시글 비밀번호 입력"
            required
          />
        </div>
      </div>

      <div class="button-group">
        <button id="verify-password" type="submit" class="btn">확인</button>
        <button id="cancel-modal" type="button" class="btn cancel">취소</button>
      </div>
    </form>
  </div>
</html>
