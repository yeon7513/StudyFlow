<!-- 파라미터로 서브 타이틑에 대한 내용을 받아옴 -->
<!-- [[]] : 인라인 표현식 -->
<!doctype html>
<html
  lang="ko"
  th:fragment="Banner(page, mainTitle, subTitle, description)"
  xmlns:th="http://www.thymeleaf.org"
>
  <div class="banner text-center mb-4 border-bottom" th:classappend="|${page}-banner|">
    <h2 class="fw-bold fs-2 mb-2" style="text-transform: uppercase">
      [[${mainTitle}]]:
      <span class="fw-normal" th:text="${subTitle}">SUB TITLE</span>
    </h2>
    <p class="mb-0" th:utext="${description}">DESCRIPTION</p>
  </div>
</html>
