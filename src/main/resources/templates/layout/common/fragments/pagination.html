<!doctype html>
<html
  lang="ko"
  th:fragment="Pagination(pager)"
  xmlns:th="http://www.thymeleaf.org"
>
  <nav aria-label="Page navigation">
    <ul class="pagination justify-content-center mb-0">

      <!-- 처음 -->
      <li class="page-item" th:classappend="${pager.page == 1} ? 'disabled'">
        <a class="page-link text-secondary" th:href="@{|?page=1${pager.query}|}">
          <i class="fa-solid fa-angles-left"></i>
        </a>
      </li>

      <!-- 이전 -->
      <li class="page-item" th:classappend="${pager.page == 1} ? 'disabled'">
        <a class="page-link text-secondary" th:href="@{|?page=${pager.prev}${pager.query}|}">
          <i class="fa-solid fa-angle-left"></i>
        </a>
      </li>

      <!-- 페이지 번호 -->
      <li class="page-item" th:each="page : ${pager.list}">
        <a class="page-link"
           th:classappend="${page == pager.page} ? 'active bg-primary border-primary' : 'text-secondary'"
           th:href="@{|?page=${page}${pager.query}|}"
           th:text="${page}">1</a>
      </li>

      <!-- 다음 -->
      <li class="page-item" th:classappend="${pager.page == pager.last} ? 'disabled'">
        <a class="page-link text-secondary" th:href="@{|?page=${pager.next}${pager.query}|}">
          <i class="fa-solid fa-angle-right"></i>
        </a>
      </li>

      <!-- 마지막 -->
      <li class="page-item" th:classappend="${pager.page == pager.last} ? 'disabled'">
        <a class="page-link text-secondary" th:href="@{|?page=${pager.last}${pager.query}|}">
          <i class="fa-solid fa-angles-right"></i>
        </a>
      </li>
    </ul>
  </nav>
</html>
